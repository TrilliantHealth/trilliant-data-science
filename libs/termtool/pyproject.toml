[project]
name = "thds.termtool"
version = "1.0"
# Patch version is a datetime determined upon release.
description = "Tools for terminal-based applications"
readme = "README.md"
authors = [{name = "Trilliant Health", email = "info@trillianthealth.com"}]
requires-python = ">=3.10"
dependencies = [
    "ansicolors",
    "thds-core",
]

#################
# Runtime dependencies should have as low a bound as the library can
# handle, and generally should have no upper bound unless actual
# breakage is found, since that allows applications and other
# libraries maximum flexibility.
#################

[project.urls]
Repository = "https://github.com/TrilliantHealth/trilliant-data-science"

[dependency-groups]
dev = [
    "pytest~=8.2",
    "pytest-cov~=4.0",
    "pytest-mock~=3.10",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
thds-core = { path = "../../libs/core", editable = true }

# TOOLING CONFIG
[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["thds.termtool"]

[tool.coverage.report]
show_missing = true

[tool.pyrefly]
project-includes = ["**/*.py*"]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
project-excludes = [
    "**/build/",
    "**/dist/",
    "**/*.egg-info/",
]
preset = "legacy"
check-unannotated-defs = true
type-ignore-unknown-tag-behavior = "no-effect"
infer-return-types = "checked"
ignore-missing-imports = ["colors"]

[tool.pyrefly.errors]
implicit-any-parameter = "error"
unannotated-return = "error"

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = "ignore"
unannotated-return = "ignore"

[tool.pytest.ini_options]
# do not run integration test by default, but CI will pick it up
addopts = "-m 'not integration'"
markers = ["integration"]
testpaths = ["tests"]
