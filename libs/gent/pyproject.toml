[project]
name = "thds.gent"
version = "1.7"
# Patch version is a datetime determined upon release.
description = "Git worktree management utilities - tree shepherds for your working trees"
readme = "README.md"
authors = [{name = "Trilliant Health", email = "info@trillianthealth.com"}]
requires-python = ">=3.10"
dependencies = [
    "argh>=0.31.0",
    "rich>=13.0.0",
    "thds.core",
]

#################
# Runtime dependencies should have as low a bound as the library can
# handle, and generally should have no upper bound unless actual
# breakage is found, since that allows applications and other
# libraries maximum flexibility.
#################

[project.scripts]
wt = "thds.gent.__main__:main"
wt-completion = "thds.gent.completion:main"

[project.urls]
repository = "https://github.com/TrilliantHealth/trilliant-data-science"

[dependency-groups]
dev = [
    "pytest~=8.2",
    "pytest-cov~=4.0",
    "pytest-mock~=3.10",
    "xonsh>=0.14.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"thds.gent" = ["shell/*"]

# TOOLING CONFIG
[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["thds.gent"]

[tool.coverage.report]
show_missing = true

[tool.pyrefly]
project-includes = ["**/*.py*"]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
project-excludes = [
    "**/build/",
    "**/dist/",
    "**/*.egg-info/",
]
preset = "legacy"
check-unannotated-defs = true
type-ignore-unknown-tag-behavior = "no-effect"
infer-return-types = "checked"
ignore-missing-imports = ["azure", "google", "ruamel.*"]
baseline = ".config/pyrefly-baseline.json"
baseline-matching-mode = "column-ordered"

[tool.pyrefly.errors]
unannotated-return = "error"
implicit-any-parameter = "error"

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = "ignore"
unannotated-return = "ignore"

[tool.pytest.ini_options]
# do not run integration test by default, but CI will pick it up
addopts = "-m 'not integration'"
markers = ["integration"]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
