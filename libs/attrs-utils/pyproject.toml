[project]
name = "thds.attrs-utils"
version = "1.9"
# Patch version is a datetime determined upon release
description = "Utilities for attrs record classes."
readme = "README.md"
authors = [{name = "Trillianth Health", email = "info@trillianthealth.com"}]
requires-python = ">=3.10"
dependencies = [
    "attrs>=22.2.0",
    "returns", # TODO - remove this + refactor accordingly
    "thds-core",
    "typing-inspect",
]

[project.optional-dependencies]
cattrs = ["cattrs>=22.2.0"]
docstrings = ["docstring-parser"]
jsonschema = ["fastjsonschema"]

[project.urls]
Repository = "https://github.com/TrilliantHealth/trilliant-data-science"

[dependency-groups]
dev = [
    "cattrs>=22.2.0",
    "docstring-parser",
    "fastjsonschema",
    "pytest~=7.2",
    "pytest-cov~=4.0",
    "pytest-mock~=3.10",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
thds-core = { path = "../../libs/core", editable = true }

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["thds.attrs_utils"]

[tool.coverage.report]
show_missing = true

[tool.pyrefly]
project-includes = ["**/*.py*"]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
project-excludes = [
    "**/build/",
    "**/dist/",
    "**/*.egg-info/",
]
preset = "legacy"
check-unannotated-defs = true
type-ignore-unknown-tag-behavior = "no-effect"
infer-return-types = "never"
ignore-missing-imports = ["fastjsonschema", "typing_inspect"]
baseline = ".config/pyrefly-baseline.json"
baseline-matching-mode = "column-ordered"

[tool.pytest.ini_options]
# do not run integration test by default, but CI will pick it up
addopts = "-m 'not integration'"
markers = ["integration"]
testpaths = ["tests"]
