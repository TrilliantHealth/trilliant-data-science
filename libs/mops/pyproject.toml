[project]
name = "thds.mops"
version = "3.34"
# Patch version is a datetime determined upon release
description = "ML Ops tools for Trilliant Health"
readme = "README.md"
authors = [{name = "Trilliant Health", email = "info@trillianthealth.com"}]
requires-python = ">=3.10"
dependencies = [
    "azure-core",
    "azure-identity",
    "azure-storage-file-datalake",
    "cachetools",
    "tblib~=2.0",
    "thds-adls",
    "thds-core",
    "thds-humenc",
    "thds-termtool",
    "tomli",
]

[project.optional-dependencies]
k8s = ["kubernetes>=18.20,!=32.0.0,!=36.0.0"]
# 32.0.0 has this bug https://github.com/kubernetes-client/python/issues/2356
# 36.0.0 has an auth bug https://github.com/kubernetes-client/python/issues/2591

[project.scripts]
krsync = "thds.mops.k8s.tools.krsync:main"
mops-k8s-ns = "thds.mops.k8s.namespace:main"
mops-exit-after = "thds.core.exit_after:main"
mops-human-sha256b64 = "thds.mops.pure.tools.sha256_b64_addressed:main"
mops-inspect = "thds.mops.pure.tools.inspect:main"
mops-summarize = "thds.mops.pure.tools.summarize.cli:main"

[project.entry-points.pytest11]
pytest-mops = "thds.mops.testing.plugin"

[project.urls]
Repository = "https://github.com/TrilliantHealth/trilliant-data-science"

[dependency-groups]
dev = [
    "kubernetes>=18.20,!=32.0.0,!=36.0.0",
    "pytest~=7.2",
    "pytest-cov~=4.0",
    "pytest-mock~=3.10",
    "pytest-xdist>=3.3.1,<4.0.0",
    "types-cachetools",
    "types-urllib3",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = [
    "*_config.toml",
    "*.yml.template",
    "*.sh",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
thds-adls = { path = "../../libs/adls", editable = true }
thds-core = { path = "../../libs/core", editable = true }
thds-humenc = { path = "../../libs/humenc", editable = true }
thds-termtool = { path = "../../libs/termtool", editable = true }

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["thds.mops"]

[tool.coverage.report]
show_missing = true

[tool.pyrefly]
project-includes = ["**/*.py*"]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
project-excludes = [
    "**/build/",
    "**/dist/",
    "**/*.egg-info/",
]
preset = "legacy"
check-unannotated-defs = true
type-ignore-unknown-tag-behavior = "no-effect"
infer-return-types = "checked"
ignore-missing-imports = [
    "azure",
    "colors",
    "google",
    "kubernetes.*",
]

[tool.pyrefly.errors]
unused-type-ignore = "error"
implicit-any-parameter = "error"
unannotated-return = "error"

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = "ignore"
unannotated-return = "ignore"

[[tool.pyrefly.sub-config]]
matches = "scripts/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = "ignore"
unannotated-return = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -s -p no:pytest-mops"
markers = ["integration"]
