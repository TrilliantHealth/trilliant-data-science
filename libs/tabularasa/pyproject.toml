[project]
name = "thds.tabularasa"
version = "0.14.19"
description = "Trilliant Health reference data build system."
readme = "README.md"
authors = [{name = "Trilliant Health", email = "info@trillianthealth.com"}]
requires-python = ">=3.10"
dependencies = [
  "attrs>=22.2",
  "cattrs>=22.2",
  "filelock",
  "networkx>=3.0",
  "numpy",
  "packaging",
  "pandas>=1.5",
  "pandera>=0.20,<0.24",  # pandera moves to pandera.pandas in 0.24
  "pydantic>=2.0.0",
  "pyarrow>=10.0",
  "pyyaml>=6.0.1",
  "setuptools>=66.1.1",
  "thds-adls",
  "thds-core",
  "typing-extensions",
]

[project.optional-dependencies]
autoformat = [
  "black",
  "isort",
]
cli = [
  "bourbaki.application>=0.10.13",
  "bourbaki.introspection>=0.5.12",
  # both bourbaki packages ship a `bourbaki/__init__.py` with a
  # `pkg_resources.declare_namespace` call in older versions; these minimums
  # ensure both use implicit namespace packages instead (see PR #4090).
  "ruamel.yaml",
  "tabulate",
]
# Support for CLI operations - code and data generation.
viz = ["pygraphviz"]
# Support for visualizing computational/dependency DAGs.

[project.scripts]
tabularasa = "thds.tabularasa.__main__:main"

[project.urls]
Repository = "https://github.com/TrilliantHealth/trilliant-data-science"

[dependency-groups]
dev = [
  # type checks
  "pandas-stubs",
  "types-pyyaml",
  "types-setuptools",
  "types-tabulate",
  # tests
  "pytest~=7.2",
  "pytest-cov~=4.0",
  # ipython
  "ipykernel",
  "ipython",
  "jupyter",
  # docs
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
  # data build
  # CLI/code generation ("cli" extra)
  "bourbaki.application>=0.10.13",
  "bourbaki.introspection>=0.5.12",
  "black",
  "isort",
  "ruamel.yaml",
  "tabulate",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
thds-adls = { path = "../../libs/adls", editable = true }
thds-core = { path = "../../libs/core", editable = true }

[tool.mono]
omit_extras = ["viz"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["thds.tabularasa"]

[tool.coverage.report]
show_missing = true

[tool.pyrefly]
project-includes = ["**/*.py*"]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
project-excludes = [
    "**/build/",
    "**/dist/",
    "**/*.egg-info/",
]
preset = "legacy"
check-unannotated-defs = true
type-ignore-unknown-tag-behavior = "no-effect"
infer-return-types = "never"
ignore-missing-imports = [
    "azure",
    "bourbaki.*",
    "google",
    "networkx",
    "pyarrow.*",
    "pygraphviz",
    "pysqlite3",
    "ruamel.*",
    "typing_inspect",
]
baseline = ".config/pyrefly-baseline.json"
baseline-matching-mode = "column-ordered"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = "integration"
